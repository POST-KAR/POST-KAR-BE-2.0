# ===================== Active Profile =====================
# Default profile is prod. To switch environments:
# - Dev: --spring.profiles.active=dev or set SPRING_PROFILES_ACTIVE=dev
# - Stage: --spring.profiles.active=stage or set SPRING_PROFILES_ACTIVE=stage
# - Prod: --spring.profiles.active=prod or set SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

server.port=${SERVER_PORT:8080}

# ===================== MongoDB Config =====================
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# ===================== Task Execution Config =====================
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8

# ===================== JWT Config =====================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-validity=${JWT_ACCESS_TOKEN_VALIDITY}
app.jwt.refresh-token-validity=${JWT_REFRESH_TOKEN_VALIDITY}

# ===================== Logging =====================
logging.level.org.springframework=${LOGGING_LEVEL_SPRING:INFO}
logging.level.com.ag.project=${LOGGING_LEVEL_PROJECT:DEBUG}

# ===================== CORS Config =====================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:*}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}

# ===================== Email Configuration =====================
# Configure SMTP settings for your email provider
# For Gmail: Try port 465 with SSL (better for cloud hosting) or port 587 with STARTTLS
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.from=${MAIL_FROM:POST-kAR}

# Application name
spring.application.name=postkar

# ===================== Google OAuth2 Configuration =====================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

app.frontend.url=${FRONTEND_URL}

server.forward-headers-strategy=native

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Cloudflare R2 Storage Configuration
cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID}
cloudflare.r2.access-key-id=${CLOUDFLARE_R2_ACCESS_KEY_ID}
cloudflare.r2.secret-access-key=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}

# App-specific settings
signed.url.expiry.hours=24
app.signed-url-expiry-minutes=1440
app.current-version=v1

spring.main.allow-circular-references=true
spring.http.client.factory=simple

