server.port=${SERVER_PORT:8080}

# ===================== MongoDB Config =====================
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# ===================== Task Execution Config =====================
spring.task.execution.pool.core-size=8
spring.task.execution.pool.max-size=16

# ===================== AR Configuration =====================
ar.database.build.enabled=true
ar.build.temp.directory=/tmp/ar-build
ar.arcoreimg.path=D:/Downloads/arcore-android-sdk-1.50.0/arcore-android-sdk-1.50.0/tools/arcoreimg/windows/arcoreimg.exe

# ===================== JWT Config =====================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-validity=${JWT_ACCESS_TOKEN_VALIDITY:86400000}
app.jwt.refresh-token-validity=${JWT_REFRESH_TOKEN_VALIDITY:604800000}

# ===================== Email Config =====================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS}

# ===================== Logging =====================
logging.level.org.springframework=${LOGGING_LEVEL_SPRING:INFO}
logging.level.com.ag.project=${LOGGING_LEVEL_PROJECT:DEBUG}

# ===================== CORS Config =====================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}

# Google OAuth2 Config
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_SCOPE:email,profile}
spring.security.oauth2.client.registration.google.client-name=${GOOGLE_CLIENT_NAME:Google}

# Facebook OAuth Configuration
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=${FACEBOOK_SCOPE:email,public_profile}
spring.security.oauth2.client.registration.facebook.client-name=${FACEBOOK_CLIENT_NAME:Facebook}

# Default redirect URI for post-login
app.oauth2.redirectUri=${OAUTH2_REDIRECT_URI}

# Application name
spring.application.name=${APPLICATION_NAME:post-kar}

server.forward-headers-strategy=native

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# AWS S3 configuration
aws.s3.region=${AWS_S3_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:postkar}
aws.access.key=${AWS_ACCESS_KEY}
aws.secret.key=${AWS_SECRET_KEY}

# App-specific settings
signed.url.expiry.hours=24
app.signed-url-expiry-minutes=1440
app.current-version=v1

spring.main.allow-circular-references=true
