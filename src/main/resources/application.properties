# MSG91 Configuration
msg91.auth.key=${MSG91_AUTH_KEY:your_msg91_auth_key_here}
msg91.template.id=${MSG91_TEMPLATE_ID:your_template_id_here}
msg91.sender.id=${MSG91_SENDER_ID:MSGIND}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/project3dmodel}

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Server Configuration
server.port=${PORT:8080}

# Logging Configuration
logging.level.com.postkar.project3dmodel=INFO
logging.level.org.springframework.security=DEBUG
